# Per environment values which override defaults in hmpps-template-kotlin/values.yaml

generic-service:
  replicaCount: 2

  podDisruptionBudget:
    enabled: false

  ingress:
    host: pre-sentence-service-qa.hmpps.service.justice.gov.uk
    tlsSecretName: court-probation-dev-cert-secret

  env:
    INGRESS_URL: "https://pre-sentence-service-qa.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    PRE_SENTENCE_TO_DELIUS_API_URL: "https://pre-sentence-reports-to-delius-dev.hmpps.service.justice.gov.uk"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api-dev.prison.service.justice.gov.uk"
    GOTENBERG_API_URL: "http://pre-sentence-service-gotenberg"
    PRE_SENTENCE_URL: "http://pre-sentence-service"
    COMMON_PLATFORM_URL: "https://login.dev.cjscp.org.uk/"
    DIGITAL_CASE_SYSTEM_URL: "https://dummy.case.system.url/"
    NDELIUS_URL: "https://ndelius.test.probation.service.justice.gov.uk"
    FEATURE_RICH_TEXT_EDITOR: false

  allowlist:
    delius-test-1: "35.176.126.163/32"
    delius-test-2: "35.178.162.73/32"
    delius-test-3: "52.56.195.113/32"
    groups:
      - internal

gotenberg:
  replicaCount: 1

